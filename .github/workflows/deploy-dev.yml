name: Deploy Dev

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: terraform-dev
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-central-1
  ARTIFACT_BUCKET: market-pulse-data-eu-central-1-dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infra/terraform/envs/dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip
        working-directory: .

      - name: Build lambda zip packages
        run: bash scripts/build_lambda_zips.sh
        working-directory: .

      - name: Verify artifacts exist
        run: |
          test -f build/planner.zip
          test -f build/worker.zip
        working-directory: .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload lambda artifacts to S3
        run: |
          ARTIFACT_PREFIX="artifacts/lambda/${GITHUB_SHA}"

          aws s3 cp build/planner.zip \
            s3://${ARTIFACT_BUCKET}/${ARTIFACT_PREFIX}/planner.zip

          aws s3 cp build/worker.zip \
            s3://${ARTIFACT_BUCKET}/${ARTIFACT_PREFIX}/worker.zip
        working-directory: .

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -input=false -var="artifact_version=${GITHUB_SHA}"

      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false -var="artifact_version=${GITHUB_SHA}"