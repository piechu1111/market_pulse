name: Build Lambda Packages

on:
  push:
    branches:
      - main
      - feat/**
      - fix/**
  pull_request:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-central-1
  ARTIFACT_BUCKET: market-pulse-data-eu-central-1-dev

jobs:
  build-lambdas:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Build lambda zip packages
        run: bash scripts/build_lambda_zips.sh

      - name: Verify artifacts exist
        run: |
          test -f build/planner.zip
          test -f build/worker.zip

      - name: Upload planner artifact to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: planner-zip
          path: build/planner.zip

      - name: Upload worker artifact to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: worker-zip
          path: build/worker.zip

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload lambda artifacts to S3
        run: |
          ARTIFACT_PREFIX="artifacts/lambda/${GITHUB_SHA}"

          aws s3 cp build/planner.zip \
            s3://${ARTIFACT_BUCKET}/${ARTIFACT_PREFIX}/planner.zip

          aws s3 cp build/worker.zip \
            s3://${ARTIFACT_BUCKET}/${ARTIFACT_PREFIX}/worker.zip