name: Build Lambda Packages

on:
  push:
    branches:
      - main
      - feat/**
      - fix/**
  pull_request:

jobs:
  build-lambdas:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Build lambda zip packages
        run: bash scripts/build_lambda_zips.sh

      - name: Verify artifacts exist
        run: |
          test -f build/planner.zip
          test -f build/worker.zip

      - name: Upload planner artifact
        uses: actions/upload-artifact@v4
        with:
          name: planner-zip
          path: build/planner.zip

      - name: Upload worker artifact
        uses: actions/upload-artifact@v4
        with:
          name: worker-zip
          path: build/worker.zip